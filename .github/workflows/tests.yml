name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-preview.txt -r requirements-cloud.txt -r requirements-preview-test.txt
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m ruff check studio/api studio/application studio/domain studio/infrastructure studio/preview_runtime.py studio/article_metadata.py preview.py tests/test_preview_close.py tests/test_preview_creation.py tests/test_article_metadata.py tests/test_preview_editor.py tests/test_preview_assistant.py tests/test_preview_tasks.py
      - run: python -m pytest -q -o faulthandler_timeout=90 --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paperplane-smoke .
      - run: docker run --rm --read-only --tmpfs /tmp:rw,mode=1777 --entrypoint python paperplane-smoke tools/verify_container.py
