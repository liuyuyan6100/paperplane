name: Public source security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: public-source-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.24.3
        shell: bash
        run: |
          set -euo pipefail
          scan_tools="$RUNNER_TEMP/paperplane-security-tools"
          mkdir -p "$scan_tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$scan_tools/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $scan_tools/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_tools/gitleaks.tar.gz" -C "$scan_tools" gitleaks
          echo "$scan_tools" >> "$GITHUB_PATH"
      - name: Verify the guards with isolated synthetic fixtures
        run: python3 -m unittest discover -s tests -p test_public_source_security.py -v
      - name: Check tracked source and all reachable history for private data
        run: |
          python3 tools/check_public_source.py
          python3 tools/check_public_source.py --all-history
      - name: Scan all reachable Git history for secrets
        run: >-
          gitleaks git . --config .gitleaks.toml
          --log-opts="--all --full-history" --redact
          --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          --max-decode-depth 3 --no-banner
