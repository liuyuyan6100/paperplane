name: paperplane
services:
  studio:
    build: .
    image: paperplane-studio:${PAPERPLANE_RELEASE:-local}
    restart: unless-stopped
    init: true
    environment:
      PAPERPLANE_PUBLIC_URL: ${PAPERPLANE_PUBLIC_URL:?Set the HTTPS public origin}
      PAPERPLANE_ACCESS_ISSUER: ${PAPERPLANE_ACCESS_ISSUER:?Set the Cloudflare Access issuer}
      PAPERPLANE_ACCESS_AUDIENCE: ${PAPERPLANE_ACCESS_AUDIENCE:?Set the Access application audience}
      PAPERPLANE_OWNER_EMAIL: ${PAPERPLANE_OWNER_EMAIL:?Set the owner email}
      PAPERPLANE_ALLOW_PROGRAM: "0"
    ports:
      - "127.0.0.1:${PAPERPLANE_PORT:-8790}:8787"
    volumes:
      - ${PAPERPLANE_DATA_DIR:-./data-cloud}:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=5)); assert r['ok']"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      website.aiclawonline.service.id: paperplane
      website.aiclawonline.service.name: 纸飞机工作台
      website.aiclawonline.service.category: creation
      website.aiclawonline.service.url: ${PAPERPLANE_PUBLIC_URL}
